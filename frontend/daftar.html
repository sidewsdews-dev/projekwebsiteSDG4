<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Daftar | SMA 4 CLOVER</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<form class="login-card" id="form-daftar" novalidate>
  <img class="login-logo" src="logo.png" alt="Logo SMA 4 CLOVER" width="64" height="67">
  <h1>Daftar Akun Siswa</h1>
  <div class="field"><label for="nama">Nama lengkap</label><input id="nama" autocomplete="name" aria-describedby="pesan-daftar"></div>
  <div class="field"><label for="nim">NIM</label><input id="nim" inputmode="numeric" aria-describedby="pesan-daftar"></div>
  <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" aria-describedby="pesan-daftar"></div>
  <div class="field"><label for="user">Username</label><input id="user" autocomplete="username" aria-describedby="pesan-daftar"></div>
  <div class="field"><label for="sandi">Kata sandi (minimal 8 karakter)</label><input id="sandi" type="password" autocomplete="new-password" aria-describedby="pesan-daftar"></div>
  <div class="field"><label for="sandi2">Ulangi kata sandi</label><input id="sandi2" type="password" autocomplete="new-password" aria-describedby="pesan-daftar"></div>
  <p class="error" id="pesan-daftar" role="alert"></p>
  <button class="btn" type="submit">Daftar</button>
  <p class="hint">Sudah punya akun? <a href="login.html">Masuk</a></p>
</form>
<div class="login-card" id="sukses" hidden>
  <img class="login-logo" src="logo.png" alt="Logo SMA 4 CLOVER" width="64" height="67">
  <h1 id="judul-sukses" tabindex="-1">Pendaftaran terkirim</h1>
  <p>Terima kasih, <strong id="nama-sukses"></strong>. Akun Anda akan diaktifkan setelah disetujui Admin sekolah.</p>
  <a class="btn" href="login.html">Ke halaman login</a>
</div>
<script src="script.js"></script>
</body>
</html>
