<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Masuk | SMA 4 CLOVER</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
  <form class="login-card" id="form-login" novalidate>
    <img class="login-logo" src="logo.png" alt="Logo SMA 4 CLOVER" width="64" height="67">
    <h1>Masuk ke Portal</h1>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" aria-describedby="pesan">
    </div>
    <div class="field">
      <label for="password">Kata Sandi</label>
      <input id="password" type="password" autocomplete="current-password" aria-describedby="pesan">
    </div>
    <p class="error" id="pesan" role="alert"></p>
    <button class="btn" type="submit">Masuk</button>
    <p class="hint">Demo: Isi username <strong>admin</strong>, <strong>guru</strong>, atau <strong>siswa</strong>, dan kata sandi bebas.</p>
    <p class="hint">Lupa kata sandi? Hubungi Admin sekolah.</p>
  </form>

  <script src="script.js"></script>
</body>

</html>
